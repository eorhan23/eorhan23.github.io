<!DOCTYPE html>
<html lang="tr">
    <head>
        <title>Hedi Aydınlar Köyü</title>
        <meta charset="utf-8">
        <link href="design.css" rel="stylesheet">
    </head>
    <body>
        <header>
            HEDİ AYDINLAR KÖYÜ
        </header>
        <nav>
            <a href="main_page.html" target="content">Ana sayfa</a>
            <a href="about.html" target="content">Hakkımızda</a>
            <a href="history.html" target="content">Tarihçe</a>
            <a href="culture_and_life.html" target="content">Kültür ve Yaşam</a>
            <a href="gallery.html" target="content">Galeri</a>
            <a href="family_tree.html" target="content">Soy Ağacı</a>
            <a href="announcements.html" target="content">Duyurular</a>
            <a href="contact.html" target="content">İletişim</a>
        </nav>
        <main>
            <iframe id="contentFrame" name="content" src="main_page.html"></iframe>
        </main>
        <footer>
            Tüm hakları saklıdır. 2026
        </footer>
        <script>
            document.addEventListener("DOMContentLoaded", function() {

                const links = document.querySelectorAll("nav a");
                const iframe = document.getElementById("contentFrame");

                // 🔥 SAYFA YENİDEN Mİ YÜKLENDİ YOKSA YENİDEN Mİ AÇILDI?
                const isReload = performance.getEntriesByType("navigation")[0].type === "reload";

                if (!isReload) {
                    // 👉 Site "yeni açıldı" → state sıfırla
                    sessionStorage.removeItem("activePage");
                }

                const savedPage = sessionStorage.getItem("activePage");

                links.forEach(l => l.classList.remove("active"));

                if (savedPage) {
                    iframe.src = savedPage;

                    links.forEach(link => {
                        if (link.getAttribute("href") === savedPage) {
                            link.classList.add("active");
                        }
                    });
                } else {
                    iframe.src = "main_page.html";

                    links.forEach(link => {
                        if (link.getAttribute("href") === "main_page.html") {
                            link.classList.add("active");
                        }
                    });
                }

                // tıklama
                links.forEach(link => {
                    link.addEventListener("click", function() {

                        links.forEach(l => l.classList.remove("active"));
                        this.classList.add("active");

                        const page = this.getAttribute("href");
                        sessionStorage.setItem("activePage", page);
                    });
                });
            });
        </script>
    </body>
</html>
